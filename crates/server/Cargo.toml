[package]
name = "lima-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
lima-db = { version = "0.1.0", path = "../db" }
lima-domain = { version = "0.1.0", path = "../domain" }
lima-indexer = { version = "0.1.0", path = "../indexer" }
lima-importers = { version = "0.1.0", path = "../importers" }
mime_guess = "2.0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["catch-panic", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
utoipa = "5.4.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.19.0", features = ["v4"] }
sqlx = { version = "0.8.6", features = ["sqlite"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }
