[package]
name = "lima-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.3"
image = "0.25.9"
lima-db = { version = "0.1.0", path = "../db" }
lima-domain = { version = "0.1.0", path = "../domain" }
mime_guess = "2.0.5"
notify = "8.2.0"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls"] }
time = { version = "0.3.45", features = ["formatting"] }
tokio = { version = "1.49.0", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1.44"
uuid = { version = "1.19.0", features = ["v4"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time"] }
